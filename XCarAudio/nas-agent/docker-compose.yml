services:
  nas-agent:
    build: .
    container_name: xcaraudio-agent
    restart: unless-stopped
    ports:
      # Accessible on your NAS at port 8899
      - "8899:8000"
    volumes:
      # Map to your AudioStation music folder on the NAS
      # DSM default: /volume1/music
      - /volume1/music:/music
    environment:
      MUSIC_DIR: /music
