services:
  nas-agent:
    build: .
    container_name: xcaraudio-agent
    restart: unless-stopped
    ports:
      # Accessible on your NAS at port 8899
      - "8899:8000"
    volumes:
      # Map to your AudioStation music folder on the NAS
      # DSM default: /volume1/music
      - /volume1/music:/music
      # - /tmp/music:/music
    env_file:
      - .env
    environment:
      MUSIC_DIR: /music
      # Optional: use Spotify Client Credentials flow for public playlist metadata.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
